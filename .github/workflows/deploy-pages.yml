name: Build and deploy Trailer Stability to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify TypeScript
        run: pnpm typecheck
      - name: Run engineering regressions
        run: pnpm test:engine
      - name: Build static GitHub Pages site
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /Trailer_Stability_BETA
      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll
      - name: Verify rendered application and Pages base path
        run: |
          node tests/rendered-html.test.mjs
          test -f dist/client/index.html
          test -f dist/client/sw.js
          test -f dist/client/autocad/SARENS_TRAILERDRAFTSMAN_v1.20_FULL_PACKAGE.zip
          test -f dist/client/autocad/SARENS_TRAILERDRAFTSMAN_v1.20_FULL_PACKAGE.sha256
          test -f dist/client/autocad/SARENS_TRAILERDRAFTSMAN_v1.23_FULL_PACKAGE.zip
          test -f dist/client/autocad/SARENS_TRAILERDRAFTSMAN_v1.23_FULL_PACKAGE.sha256
          grep -q "/Trailer_Stability_BETA/" dist/client/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
